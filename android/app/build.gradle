plugins {
    id "com.android.application"
}

android {
    namespace "com.michaela.adventure"
    compileSdk 34

    defaultConfig {
        applicationId "com.michaela.adventure"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("michaela-release.keystore")
            storePassword "freyaanddragon"
            keyAlias "michaela"
            keyPassword "freyaanddragon"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
