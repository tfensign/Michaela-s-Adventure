name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MichaelasAdventure.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: MichaelasAdventure-apk
          path: MichaelasAdventure.apk

      - name: Publish a download link (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Michaela's Adventure (build ${{ github.run_number }})
          body: "Open this page on your Android phone and tap **MichaelasAdventure.apk** to download and install."
          files: MichaelasAdventure.apk
          make_latest: true
